# Единственная автоматическая проверка проекта. До неё контроль качества
# сводился к `pytest`, запускаемому руками по памяти.
#
# `ruff format` здесь намеренно нет — почему, написано в `pyproject.toml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `bot/config.py` создаёт `Settings()` **на импорте**, и без токена падает
      # ещё на сборе тестов. Значение любое непустое: сети в тестах нет
      BOT_TOKEN: ci-dummy-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в Dockerfile. Дома стоит 3.11 — расхождение
          # намеренно: так CI заодно проверяет, что проект жив на обеих
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Всё запускается из корня: `.env` и `data/` ищутся от текущего каталога,
      # из другого каталога падает даже pytest
      - name: Линтер
        run: ruff check .

      - name: Проверка типов
        run: mypy

      - name: Тесты
        run: pytest -q
