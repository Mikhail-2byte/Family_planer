# Слепок окружения, на котором проект действительно работает и проходит
# тесты. Снят 29.08.2026 с домашней машины.
#
# Зачем он нужен: `requirements.txt` задан диапазонами (`aiogram>=3.31,<4`),
# и это правильно для разработки, но не для боевой пересборки. Образ на VPS
# собирается когда придётся, и `pip` втянет тот минор, который вышел к тому
# дню. Для бота, который семья держит вместо календаря, «собрался — и повёл
# себя иначе» дороже, чем отставание на версию.
#
# Dockerfile ставит отсюда. Дома по-прежнему `requirements-dev.txt`:
# разработке диапазоны нужны, иначе обновление никогда не случится.
#
# Обновлять так:
#   .venv/Scripts/pip install -U -r requirements.txt
#   .venv/Scripts/python -m pytest        # обязательно, до записи слепка
#   .venv/Scripts/pip freeze > requirements.lock   # и убрать отсюда dev-пакеты

